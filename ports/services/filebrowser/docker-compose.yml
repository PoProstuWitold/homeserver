services:
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    ports:
      - 8089:80
    environment:
      - PUID=0
      - PGID=0
    volumes:
      - /srv:/srv
      - /srv/server/services/filebrowser/config:/config
      - /srv/server/services/filebrowser/database:/database
    restart: unless-stopped